<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML/CSS Challenge</title>
  <link rel="stylesheet" href="css.css">
</head>

<body>

  <div class="layout">

    <div class="editor">
      <h2>CHALLENGE – <span id="challenge-name"></span></h2>

      <p id="challenge-instruction" class="hint"></p>

      <pre id="code-snippet"></pre>

      <label for="answer" class="hint">Type your answer here:</label>
      <input id="answer" type="text" autocomplete="off" />

      <button onclick="runCode()">Run / Check</button>
      <div id="result" class="result"></div>
    </div>

    <div class="preview">
      <h2>PREVIEW</h2>
      <iframe id="frame"></iframe>
    </div>

  </div>

<script>
  // --- CHALLENGES SIMPLIFIÉS ---
  const challenges = [
// === HARD CHALLENGES ===

// === SUPER SIMPLE HTML & CSS CARDS ===


  // 1) FLEXBOX
  {
    title: "Enable Flexbox",
    instruction: "Write the value that activates flexbox.",
    snippet: `/* Activate flexbox 😌 */\n.container {\n  display: ____;\n}`,
    buildPage(answer) {
      return `
      <html>
      <style>
        body { margin:0; }
        .container {
          display:${answer};
          justify-content:center;
          align-items:center;
          height:100vh;
          background:#eee;
          font-size:28px;
          font-family:sans-serif;
        }
      </style>
      <body>
        <div class="container">Flex activated!</div>
      </body>
      </html>`;
    },
    check(answer) {
      return answer.trim().toLowerCase() === "flex";
    }
  },

  // 2) BOLD TEXT
  {
    title: "Bold Text",
    instruction: "Write the value that makes text bold.",
    snippet: `/* Make me strong 💪 */\nh1 {\n  font-weight: ____;\n}`,
    buildPage(answer) {
      return `
      <html>
      <style>
        h1 {
          font-weight:${answer};
          text-align:center;
          font-size:40px;
          margin-top:80px;
          font-family:sans-serif;
        }
      </style>
      <body>
        <h1>Bold title!</h1>
      </body>
      </html>`;
    },
    check(answer) {
      return answer.trim().toLowerCase() === "bold";
    }
  },

  // 3) CENTER TEXT
  {
    title: "Center Text",
    instruction: "Write the value that centers text.",
    snippet: `/* Center me ➕ */\n.box {\n  text-align: ____;\n}`,
    buildPage(answer) {
      return `
      <html>
      <style>
        .box {
          text-align:${answer};
          margin-top:120px;
          font-size:32px;
          font-family:sans-serif;
        }
      </style>
      <body>
        <div class="box">Centered text!</div>
      </body>
      </html>`;
    },
    check(answer) {
      return answer.trim().toLowerCase() === "center";
    }
  },

  // 4) REMOVE BULLETS
  {
    title: "Remove Bullets",
    instruction: "Write the value that removes list bullets.",
    snippet: `/* No bullets 🔫 */\nul {\n  list-style: ____;\n}`,
    buildPage(answer) {
      return `
      <html>
      <style>
        ul {
          list-style:${answer};
          font-size:28px;
          margin-top:60px;
          font-family:sans-serif;
        }
      </style>
      <body>
        <ul>
          <li>Item 1</li>
          <li>Item 2</li>
        </ul>
      </body>
      </html>`;
    },
    check(answer) {
      return answer.trim().toLowerCase() === "none";
    }
  },

  // 5) HIDE ELEMENT
  {
    title: "Hide Element",
    instruction: "Write the value that hides an element.",
    snippet: `/* Make me disappear 🪄 */\n.box {\n  display: ____;\n}`,
    buildPage(answer) {
      return `
      <html>
      <style>
        .box {
          display:${answer};
          font-size:32px;
          margin-top:80px;
          font-family:sans-serif;
        }
      </style>
      <body>
        <div class="box">You shouldn't see me 👀</div>
        <div style="margin-top:40px; text-align:center; font-size:28px;">
          Hidden or not?
        </div>
      </body>
      </html>`;
    },
    check(answer) {
      return answer.trim().toLowerCase() === "none";
    }
  }

  ];

  let currentChallenge = null;
  let attempts = 0;
  const maxAttempts = 3;

  // --- Charger un challenge aléatoire ---
function loadRandomChallenge() {
  const titleEl = document.getElementById('challenge-name');
  const instructionEl = document.getElementById('challenge-instruction');
  const snippetEl = document.getElementById('code-snippet');
  const answerInput = document.getElementById('answer');
  const frame = document.getElementById('frame');
  const result = document.getElementById('result');
  const button = document.querySelector('button');

  const index = Math.floor(Math.random() * challenges.length);
  currentChallenge = challenges[index];

  attempts = 0;
  answerInput.disabled = false;
  button.disabled = false;
  answerInput.value = "";
  result.textContent = "";
  result.style.color = "";

  titleEl.textContent = currentChallenge.title;
  instructionEl.textContent = currentChallenge.instruction;
  snippetEl.textContent = currentChallenge.snippet;

  // 🆕 petit message par défaut dans la preview
  frame.srcdoc = `
    <style>
      body { 
        background:#111827; 
        color:#e5e7eb; 
        font-family: system-ui, sans-serif; 
        display:flex; 
        align-items:center; 
        justify-content:center; 
        height:100vh; 
        margin:0;
        text-align:center;
      }
    </style>
    <body>
      <p>Type your answer and click<br><strong>“Run / Check”</strong> 👇</p>
    </body>
  `;
}


  // --- Verrouillage après 3 essais ---
  function lockChallenge(message) {
    const answerInput = document.getElementById('answer');
    const button = document.querySelector('button');
    const result = document.getElementById('result');

    answerInput.disabled = true;
    button.disabled = true;
    result.textContent = message;
    result.style.color = "red";
  }

  // --- Vérification au clic sur le bouton ---
function runCode() {
  if (!currentChallenge) return;

  const answerInput = document.getElementById('answer');
  const frame = document.getElementById('frame');
  const result = document.getElementById('result');

  if (answerInput.disabled) return;

  const answerRaw = answerInput.value;
  const answer = answerRaw.trim();

  // 🆕 Si aucune réponse, on ne consomme PAS d'essai
  if (answer === "") {
    result.textContent = "Please type an answer before running 🙂";
    result.style.color = "orange";
    return;
  }

  // Construire la page à partir de la réponse
  const page = currentChallenge.buildPage(answer);
  frame.srcdoc = page;

  // Vérification
  if (currentChallenge.check(answer)) {
    result.textContent = "✅ Correct! Well done.";
    result.style.color = "lightgreen";
  } else {
    attempts++;
    if (attempts >= maxAttempts) {
      lockChallenge("❌ You lost. No more attempts.");
    } else {
      const left = maxAttempts - attempts;
      result.textContent =
        `❌ Incorrect (${left} attempt${left > 1 ? "s" : ""} left).`;
      result.style.color = "orange";
    }
  }
}


  window.addEventListener("DOMContentLoaded", loadRandomChallenge);
</script>

</body>
</html>
