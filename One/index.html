<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML/CSS Challenge</title>
  <link rel="stylesheet" href="css.css">
</head>

<body>

  <div class="layout">

    <div class="editor">
      <h2>CHALLENGE – <span id="challenge-name"></span></h2>

      <p id="challenge-instruction" class="hint"></p>

      <pre id="code-snippet"></pre>

      <label for="answer" class="hint">Type your answer here:</label>
      <input id="answer" type="text" autocomplete="off" />

      <button onclick="runCode()">Run / Check</button>
      <div id="result" class="result"></div>
    </div>

    <div class="preview">
      <h2>PREVIEW</h2>
      <iframe id="frame"></iframe>
    </div>

  </div>

<script>
  // --- CHALLENGES SIMPLIFIÉS ---
  const challenges = [
{
  title: "Angry Title",
  instruction: "Make the title red.",
  snippet: `/* The title is angry today, make it red 😡 */\nh1 {\n  color: ____;\n}`,
  buildPage(answer) {
    return `
    <style>h1{color:${answer};text-align:center;font-size:40px;}</style>
    <h1>I'm angry!!</h1>`;
  },
  check(ans) { return ans.trim().toLowerCase() === "red"; }
},

{
  title: "Shy Title",
  instruction: "Center the title.",
  snippet: `/* The title is shy… put it in the center 🙈 */\nh1 {\n  text-align: ____;\n}`,
  buildPage(answer) {
    return `
    <style>h1{text-align:${answer};font-size:40px;}</style>
    <h1>Hello...</h1>`;
  },
  check(ans) { return ans.trim().toLowerCase() === "center"; }
},

{
  title: "Screaming Title",
  instruction: "Make the title bold.",
  snippet: `/* The title wants to scream LOUDER 😱 */\nh1 {\n  font-weight: ____;\n}`,
  buildPage(answer) {
    return `
    <style>h1{font-weight:${answer};text-align:center;font-size:40px;}</style>
    <h1>AAAAAH!</h1>`;
  },
  check(ans) { return ans.trim().toLowerCase() === "bold"; }
},

{
  title: "Sad Paragraph",
  instruction: "Make the text blue.",
  snippet: `/* The paragraph is feeling a bit sad today 😢 */\np {\n  color: ____;\n}`,
  buildPage(answer) {
    return `
    <style>p{color:${answer};text-align:center;font-size:30px;}</style>
    <p>I'm blue...</p>`;
  },
  check(ans) { return ans.trim().toLowerCase() === "blue"; }
},

{
  title: "Sunshine Mode",
  instruction: "Make the background yellow.",
  snippet: `/* The page wants sunshine 🌞 Give it a yellow background */\nbody {\n  background-color: ____;\n}`,
  buildPage(answer) {
    return `
    <style>body{background:${answer};text-align:center;font-size:30px;}</style>
    <h1>So sunny!</h1>`;
  },
  check(ans) { return ans.trim().toLowerCase() === "yellow"; }
},

{
  title: "Invisible Ninja",
  instruction: "Make the title white.",
  snippet: `/* The title is a sneaky ninja 🥷 Make it white */\nh1 {\n  color: ____;\n}`,
  buildPage(answer) {
    return `
    <style>body{background:black;}
           h1{color:${answer};text-align:center;font-size:40px;}
    </style>
    <h1>...</h1>`;
  },
  check(ans) { return ans.trim().toLowerCase() === "white"; }
}



    
  ];

  let currentChallenge = null;
  let attempts = 0;
  const maxAttempts = 3;

  // --- Charger un challenge aléatoire ---
function loadRandomChallenge() {
  const titleEl = document.getElementById('challenge-name');
  const instructionEl = document.getElementById('challenge-instruction');
  const snippetEl = document.getElementById('code-snippet');
  const answerInput = document.getElementById('answer');
  const frame = document.getElementById('frame');
  const result = document.getElementById('result');
  const button = document.querySelector('button');

  const index = Math.floor(Math.random() * challenges.length);
  currentChallenge = challenges[index];

  attempts = 0;
  answerInput.disabled = false;
  button.disabled = false;
  answerInput.value = "";
  result.textContent = "";
  result.style.color = "";

  titleEl.textContent = currentChallenge.title;
  instructionEl.textContent = currentChallenge.instruction;
  snippetEl.textContent = currentChallenge.snippet;

  // 🆕 petit message par défaut dans la preview
  frame.srcdoc = `
    <style>
      body { 
        background:#111827; 
        color:#e5e7eb; 
        font-family: system-ui, sans-serif; 
        display:flex; 
        align-items:center; 
        justify-content:center; 
        height:100vh; 
        margin:0;
        text-align:center;
      }
    </style>
    <body>
      <p>Type your answer and click<br><strong>“Run / Check”</strong> 👇</p>
    </body>
  `;
}


  // --- Verrouillage après 3 essais ---
  function lockChallenge(message) {
    const answerInput = document.getElementById('answer');
    const button = document.querySelector('button');
    const result = document.getElementById('result');

    answerInput.disabled = true;
    button.disabled = true;
    result.textContent = message;
    result.style.color = "red";
  }

  // --- Vérification au clic sur le bouton ---
function runCode() {
  if (!currentChallenge) return;

  const answerInput = document.getElementById('answer');
  const frame = document.getElementById('frame');
  const result = document.getElementById('result');

  if (answerInput.disabled) return;

  const answerRaw = answerInput.value;
  const answer = answerRaw.trim();

  // 🆕 Si aucune réponse, on ne consomme PAS d'essai
  if (answer === "") {
    result.textContent = "Please type an answer before running 🙂";
    result.style.color = "orange";
    return;
  }

  // Construire la page à partir de la réponse
  const page = currentChallenge.buildPage(answer);
  frame.srcdoc = page;

  // Vérification
  if (currentChallenge.check(answer)) {
    result.textContent = "✅ Correct! Well done.";
    result.style.color = "lightgreen";
  } else {
    attempts++;
    if (attempts >= maxAttempts) {
      lockChallenge("❌ You lost. No more attempts.");
    } else {
      const left = maxAttempts - attempts;
      result.textContent =
        `❌ Incorrect (${left} attempt${left > 1 ? "s" : ""} left).`;
      result.style.color = "orange";
    }
  }
}


  window.addEventListener("DOMContentLoaded", loadRandomChallenge);
</script>

</body>
</html>
